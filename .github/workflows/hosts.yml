name: Dataset hosts

on:
  schedule:
    # Every Monday at six in the morning UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Commands run in the environment installed below instead of syncing the lockfile.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The lockfile pins CUDA builds of PyTorch, which this job never uses. The environment is
      # installed with the CPU builds instead.
      - run: uv venv

      - run: uv pip install --no-sources --torch-backend cpu -e . --group dev

      # Archives are checked through their central directory and plain files are downloaded whole.
      # The job fails when any file changed or could not be read.
      - run: uv run polyps-data verify
